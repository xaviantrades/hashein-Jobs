name: Deploy Hashein Jobs static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "static-site/**"
      - "hashein-email-integration/public/images/**"
      - "hashein-email-integration/public/favicon.svg"
      - "hashein-email-integration/src/assets/*.woff2"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy static assets
        run: |
          mkdir -p static-site/assets
          cp hashein-email-integration/public/images/hashein-hero.jpg static-site/assets/
          cp hashein-email-integration/public/images/hashein-skills.jpg static-site/assets/
          cp hashein-email-integration/public/favicon.svg static-site/assets/
          cp hashein-email-integration/src/assets/dm-sans-latin.woff2 static-site/assets/
          cp hashein-email-integration/src/assets/manrope-latin.woff2 static-site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
